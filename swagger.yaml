swagger: "2.0"
info:
  title: "My Movie API"
  description: "API documentation for my Flask project"
  version: "1.0.0"
host: "127.0.0.1:5000"
basePath: "/"
schemes:
  - http
produces:
  - application/json
paths:
  /auth/login:
    post:
      summary: "Login user"
      tags:
        - Auth
      parameters:
        - in: body
          name: body
          required: true
          schema:
            properties:
              email:
                type: string
                example: "ali@gmail.com"
              password:
                type: string
                example: "123456"
      responses:
        200:
          description: "Login successful"
        400:
          description: "Email and password are required"
        401:
          description: "Invalid credentials"
        500:
          description: "Unable to complete login"


  /auth/signup:
    post:
      summary: "Register new user"
      tags:
        - Auth
      parameters:
        - in: body
          name: body
          required: true
          schema:
            properties:
              name:
                type: string
                example: "Ali"
              email:
                type: string
                example: "ali@gmail.com"
              password:
                type: string
                example: "123456"
      responses:
        201:
          description: "Signup successful"
        400:
          description: "Email and password are required"
        409:
          description: "try another email"
        500:
          description: "Unable to complete signup"

  /auth/logout:
    post:
      summary: "Logout user"
      tags:
        - Auth
      parameters:
        - in: header
          name: Authorization
          required: true
          type: string
          example: "Bearer your_access_token"
      responses:
        200:
          description: "Logout successful"
        401:
          description: "Unauthorized (missing, expired, or revoked token)"
        422:
          description: "Invalid Authorization header or wrong token type"
        500:
          description: "Unable to logout"

  /auth/refresh:
    post:
      summary: "Get new access token"
      tags:
        - Auth
      parameters:
        - in: header
          name: Authorization
          required: true
          type: string
          example: "Bearer your_refresh_token"
        - in: header
          name: X-Access-Token
          required: false
          type: string
          example: "Bearer your_expired_access_token"
      responses:
        200:
          description: "New access token returned"
        401:
          description: "Unable to refresh token"

  /auth/forget:
    post:
      summary: "Change password"
      tags:
        - Auth
      parameters:
        - in: body
          name: body
          required: true
          schema:
            properties:
              email:
                type: string
                example: "ali@gmail.com"
              current_password:
                type: string
                example: "oldpassword123"
              password:
                type: string
                example: "newpassword123"
            required:
              - email
              - current_password
              - password
      responses:
        200:
          description: "Password updated successfully"
        400:
          description: "Email, current password and new password are required"
        401:
          description: "incorrect current password"
        409:
          description: "email user not found"
        500:
          description: "Unable to reset password"


  /movies/:
    get:
      summary: "Get movies"
      tags:
        - Movies
      parameters:
        - in: header
          name: Authorization
          required: true
          type: string
          example: "Bearer your_access_token"
        - in: query
          name: id
          required: false
          type: integer
          description: "Return a single movie; filters and pagination are ignored"
          example: 10
        - in: query
          name: include
          required: false
          type: string
          enum:
            - actors
          example: "actors"
        - in: query
          name: page
          required: false
          type: integer
          description: "Page number, starting at 1"
          default: 1
          example: 2
        - in: query
          name: per_page
          required: false
          type: integer
          description: "Items per page, default 20; values above 50 are capped at 50"
          default: 20
          example: 20
        - in: query
          name: year
          required: false
          type: integer
          description: "Exact release year"
          example: 2024
        - in: query
          name: rating
          required: false
          type: integer
          description: "Rating bucket, 0-10. rating=1 returns 1.0-1.9, rating=2 returns 2.0-2.9, and so on"
          example: 8
        - in: query
          name: language
          required: false
          type: string
          description: "Exact language code"
          example: "en"
        - in: query
          name: quality
          required: false
          type: string
          description: "Torrent quality, for example 720p, 1080p, 2160p"
          example: "1080p"
        - in: query
          name: q
          required: false
          type: string
          description: "Case-insensitive search in title and title_english"
          example: "matrix"
      responses:
        200:
          description: "Paginated movie list. With ?id=, a single Movie object is returned instead"
          schema:
            $ref: "#/definitions/MoviePage"
        400:
          description: "Invalid query parameter"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized (missing, expired, or revoked token)"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Movie not found"
          schema:
            $ref: "#/definitions/Error"
        422:
          description: "Invalid Authorization header or wrong token type"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "A database error occurred or an unexpected error occurred"
          schema:
            $ref: "#/definitions/Error"

  /movies/recommendation:
    post:
      summary: "Get movie recommendations"
      description: "Get recommendations by movie ID (similar movies) or by chat message (RAG based). Send only one at a time."
      tags:
        - Movies
      parameters:
        - in: header
          name: Authorization
          required: true
          type: string
          example: "Bearer your_access_token"
        - in: query
          name: id
          required: false
          type: integer
          example: 10
        - in: body
          name: body
          required: false
          schema:
            properties:
              user_message:
                type: string
                example: "I want to watch a scary horror movie"
      responses:
        200:
          description: 'Recommendations returned successfully; when neither id nor user_message is provided, returns "Please enter message or movie_id"'
        401:
          description: "Unauthorized (missing, expired, or revoked token)"
        404:
          description: "Movie not found or No recommendation found"
        422:
          description: "Invalid Authorization header or wrong token type"
        429:
          description: "AI service rate limit reached. Please try again later."
        500:
          description: "A database error occurred or an unexpected error occurred"
        503:
          description: "AI service authentication failed, AI service is currently unavailable, or Embedding service is currently unavailable"







  /profile/:
    get:
      summary: "Get user profile"
      tags:
        - Profile
      parameters:
        - in: header
          name: Authorization
          required: true
          type: string
          example: "Bearer your_access_token"
      responses:
        200:
          description: "Profile fetched successfully"
        401:
          description: "Unauthorized (missing, expired, or revoked token)"
        404:
          description: "User not found"
        422:
          description: "Invalid Authorization header or wrong token type"
        500:
          description: "A database error occurred or an unexpected error occurred"

    post:
      summary: "Create or update profile"
      tags:
        - Profile
      consumes:
        - multipart/form-data
      parameters:
        - in: header
          name: Authorization
          required: true
          type: string
          example: "Bearer your_access_token"
        - in: formData
          name: name
          required: false
          type: string
          example: "Ali"
        - in: formData
          name: email
          required: false
          type: string
          example: "ali@gmail.com"
        - in: formData
          name: phone
          required: false
          type: string
          example: "0300-1234567"
        - in: formData
          name: location
          required: false
          type: string
          example: "Lahore"
        - in: formData
          name: image
          required: false
          type: file
      responses:
        200:
          description: "Profile updated successfully"
        401:
          description: "Unauthorized (missing, expired, or revoked token)"
        404:
          description: "User not found"
        422:
          description: "Invalid Authorization header or wrong token type"
        500:
          description: "Upload folder is not configured, Unable to update profile, or an unexpected error occurred"

definitions:
  Error:
    type: object
    properties:
      message:
        type: string
        example: "Invalid query parameter"

  MovieImage:
    type: object
    properties:
      background_image:
        type: string
      background_image_original:
        type: string
      small_cover_image:
        type: string
      medium_cover_image:
        type: string
      large_cover_image:
        type: string
      medium_screenshot_image1:
        type: string
      medium_screenshot_image2:
        type: string
      medium_screenshot_image3:
        type: string
      large_screenshot_image1:
        type: string
      large_screenshot_image2:
        type: string
      large_screenshot_image3:
        type: string

  Torrent:
    type: object
    properties:
      id:
        type: integer
      url:
        type: string
      hash:
        type: string
      quality:
        type: string
        example: "1080p"
      type:
        type: string
      is_repack:
        type: string
      video_codec:
        type: string
      bit_depth:
        type: string
      audio_channels:
        type: string
      seeds:
        type: integer
      peers:
        type: integer
      size:
        type: string
      size_bytes:
        type: integer
        format: int64
      date_uploaded:
        type: string
      date_uploaded_unix:
        type: integer
        format: int64

  CastMember:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      character_name:
        type: string
      url_small_image:
        type: string
      imdb_code:
        type: string

  Movie:
    type: object
    properties:
      id:
        type: integer
      yts_id:
        type: integer
      imdb_code:
        type: string
      title:
        type: string
      title_english:
        type: string
      slug:
        type: string
      year:
        type: integer
        example: 2024
      rating:
        type: number
        format: float
        example: 8.4
      runtime:
        type: integer
      genres:
        type: array
        items:
          type: string
      description_full:
        type: string
      yt_trailer_code:
        type: string
      language:
        type: string
        example: "en"
      mpa_rating:
        type: string
      date_uploaded:
        type: string
      date_uploaded_unix:
        type: integer
        format: int64
      is_fetched:
        type: boolean
      images:
        $ref: "#/definitions/MovieImage"
      torrents:
        type: array
        items:
          $ref: "#/definitions/Torrent"
      cast:
        type: array
        description: "Present only when include=actors is used"
        items:
          $ref: "#/definitions/CastMember"

  MoviePage:
    type: object
    properties:
      page:
        type: integer
        example: 1
      per_page:
        type: integer
        example: 20
      total:
        type: integer
        example: 137
      pages:
        type: integer
        example: 7
      items:
        type: array
        items:
          $ref: "#/definitions/Movie"
